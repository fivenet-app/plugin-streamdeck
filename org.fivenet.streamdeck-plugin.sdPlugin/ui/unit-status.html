<!DOCTYPE html>
<html>

<head lang="en">
    <title>Einheiten Status</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
    <sdpi-item label="Status">
        <sdpi-radio setting="status" columns="2">
            <option value="available">Verfügbar</option>
            <option value="busy">Beschäftigt</option>
            <option value="onbreak">Pause</option>
            <option value="unavailable">Nicht verfügbar</option>
        </sdpi-radio>
    </sdpi-item>
</body>

</html>
