<!DOCTYPE html>
<html>

<head lang="en">
    <title data-i18n-title="login.pageTitle">FiveNet Login</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
    <script src="i18n.js"></script>
    <style>
        .section-title {
            font-size: 12px;
            color: #ccc;
            margin-bottom: 6px;
        }
    </style>
</head>

<body>
    <section>
        <div class="section-title" data-i18n="login.section">Login</div>
        <div id="login-form">
            <sdpi-item label="Server URL" data-i18n-label="login.serverUrl">
                <sdpi-textfield setting="serverURL" placeholder="https://demo.fivenet.app"></sdpi-textfield>
            </sdpi-item>

            <sdpi-item label="Username" data-i18n-label="login.username">
                <sdpi-textfield setting="username" placeholder="Username"></sdpi-textfield>
            </sdpi-item>

            <sdpi-item label="Password" data-i18n-label="login.password">
                <sdpi-password setting="password" placeholder="Password"></sdpi-password>
            </sdpi-item>

            <sdpi-item label="Language" data-i18n-label="login.language">
                <sdpi-select setting="language" global default="en">
                    <option value="en">English</option>
                    <option value="de">Deutsch</option>
                </sdpi-select>
            </sdpi-item>

            <sdpi-item label="Automatic login" data-i18n-label="login.autoRelogin">
                <sdpi-checkbox global setting="autoRelogin" label="Sign in again automatically when the login expires" data-i18n-label="login.autoReloginHint"></sdpi-checkbox>
            </sdpi-item>

            <sdpi-item>
                <sdpi-button onclick="doLogin()" data-i18n="login.submit">Sign in</sdpi-button>
            </sdpi-item>
        </div>
    </section>

    <div id="status" style="margin-top:8px;padding:4px 8px;font-size:11px;color:#aaa;"></div>

    <div style="margin-top:10px;font-size:11px;color:#888;" data-i18n="login.hint">
        After signing in, activate the desired character with the "Select Character" key.
    </div>

    <script>
        const i18n = window.fivenetI18n;
        const statusEl = document.getElementById('status');
        let statusRender = function () { return ''; };

        function setStatus(render, color) {
            statusRender = render;
            statusEl.textContent = render();
            statusEl.style.color = color || '#aaa';
        }

        window.addEventListener('fivenet-language', function () {
            statusEl.textContent = statusRender();
        });

        async function doLogin() {
            setStatus(function () { return i18n.t('login.connecting'); }, '#ffcc00');

            const serverURL = document.querySelector('[setting="serverURL"]').value;
            const username = document.querySelector('[setting="username"]').value;
            const password = document.querySelector('[setting="password"]').value;

            if (!serverURL || !username || !password) {
                setStatus(function () { return i18n.t('login.missingFields'); }, '#ff4444');
                return;
            }

            try {
                await SDPIComponents.streamDeckClient.send("sendToPlugin", {
                    event: "login",
                    payload: { serverURL: serverURL, username: username, password: password }
                });
                setStatus(function () { return i18n.t('login.sent'); }, '#44cc44');
            } catch (e) {
                setStatus(function () { return i18n.format('login.error', { message: e.message }); }, '#ff4444');
            }
        }

        SDPIComponents.streamDeckClient.sendToPropertyInspector.subscribe((data) => {
            const payload = data?.payload ?? {};
            if (payload.event === 'session') {
                if (payload.credentials) {
                    ['serverURL', 'username', 'password'].forEach((key) => {
                        const el = document.querySelector('[setting="' + key + '"]');
                        if (el && payload.credentials[key]) {
                            el.value = payload.credentials[key];
                        }
                    });
                }
                if (payload.session) {
                    const name = payload.session.charName;
                    setStatus(function () { return i18n.format('login.signedInAs', { name: name }); }, '#44cc44');
                } else if (payload.error) {
                    setStatus(function () { return i18n.t('login.sessionFailed'); }, '#ff4444');
                }
            } else if (payload.event === 'login-success') {
                const name = payload.charName;
                const needsCharSelection = payload.needsCharSelection;
                setStatus(function () {
                    return needsCharSelection
                        ? i18n.t('login.charNeeded')
                        : i18n.t('login.success') + (name ? ': ' + name : '');
                }, '#44cc44');
            } else if (payload.event === 'login-error') {
                const message = payload.message || i18n.t('login.unknown');
                setStatus(function () { return i18n.format('login.error', { message: message }); }, '#ff4444');
            }
        });

        SDPIComponents.streamDeckClient.send("sendToPlugin", {
            event: "get-session"
        });
    </script>
</body>

</html>
